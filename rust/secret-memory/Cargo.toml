[package]
name = "secretserver-memory"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Explicit secret ownership and optional guarded native memory for Secret Server tooling"
publish = false

[features]
default = ["guarded"]
guarded = ["dep:libsodium-sys-stable"]

[dependencies]
secrecy = "=0.10.3"
zeroize = "=1.9.0"
libsodium-sys-stable = { version = "=1.24.0", optional = true }
